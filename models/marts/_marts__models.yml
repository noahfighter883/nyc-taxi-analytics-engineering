version: 2

models:
  - name: fct_trips
    description: One row per valid trip. Grain matches stg_trips; this is the trip-level fact table analysts and BI tools should query instead of the staging layer.
    columns:
      - name: trip_id
        data_tests:
          - unique
          - not_null
      - name: pickup_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
      - name: dropoff_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id

  - name: dim_zones
    description: One row per taxi zone (LocationID).
    columns:
      - name: location_id
        data_tests:
          - unique
          - not_null

  - name: dim_dates
    description: Date dimension, one row per calendar day, 2023-01-01 through 2025-12-31.
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: mart_zone_demand_summary
    description: Zone-level monthly demand -- trip count, avg fare, avg duration, and demand tier, joined to zone/borough names. The table a BI tool would point at.
    columns:
      - name: zone
        data_tests:
          - not_null
